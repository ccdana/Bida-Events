; Ajustes de PHP para producción (imagen «production» del Dockerfile).

; Las imágenes oficiales de PHP no dejan activo ningún php.ini y short_open_tag viene en On: con
; eso, toda vista que empiece con <?xml (sitemap.blade.php) se rompe.
short_open_tag = Off
expose_php = Off

; Las exportaciones a Excel y los PDF de DomPDF son lo que más memoria pide.
memory_limit = 512M

; Videos de hasta 100 MB desde el editor, con margen para la cabecera del formulario.
upload_max_filesize = 110M
post_max_size = 120M
max_file_uploads = 20
max_execution_time = 120

; El código de la imagen no cambia: se compila una vez y no se revisa en cada petición.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; Los errores van al registro del contenedor (docker compose logs), nunca a la pantalla.
display_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
