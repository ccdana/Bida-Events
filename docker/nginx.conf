# Nginx del contenedor «web» en producción: sirve los archivos de public/ y manda el resto a
# PHP-FPM (servicio «app»). El HTTPS lo pone Cloudflare o el proxy de enfrente; ver docs/docker.md.

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Videos de hasta 100 MB desde el editor (el mismo límite que php.prod.ini)
    client_max_body_size 120M;

    # La IP real del invitado (los límites por IP dependen de esto). Solo se le cree a Cloudflare:
    # si se confiara en cualquiera, cualquiera podría mandar una IP falsa y saltarse los límites.
    # Lista vigente: https://www.cloudflare.com/ips/
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # Archivos compilados por Vite: llevan hash en el nombre y no cambian nunca
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Fotos subidas al disco del servidor (cuando no hay Cloudinary). Viven en el volumen de
    # storage, compartido con el contenedor app; por eso van por alias y no por el enlace de
    # public/storage, que quedaría dentro de la imagen.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS $http_x_forwarded_proto;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Ningún otro .php se ejecuta, y nada de archivos ocultos (.env, .git)
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
