; Ajustes de PHP para el entorno de desarrollo en Docker.

; Las imágenes oficiales de PHP no dejan activo ningún php.ini, y de fábrica short_open_tag viene
; en On. Con eso, toda vista que empiece con <?xml (sitemap.blade.php) se rompe: PHP lee el "<?"
; como apertura de código. Los php.ini que reparte PHP lo ponen en Off; acá se hace lo mismo.
short_open_tag = Off

; Las exportaciones a Excel y los PDF de DomPDF son lo que más memoria pide.
memory_limit = 512M

; El fotomural acepta fotos de hasta 5 MB (ContributionController). Se deja margen
; para que el navegador pueda mandar varias a la vez.
upload_max_filesize = 20M
post_max_size = 24M
max_file_uploads = 20

max_execution_time = 120

; En desarrollo el código cambia todo el tiempo: se revisa en cada petición.
opcache.enable = 1
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1

; Los errores se ven en la terminal de `docker compose logs app`.
display_errors = On
error_reporting = E_ALL
